# Pinned so the project name (and therefore the node_modules volume and
# container names) does not change if the directory is renamed or cloned.
name: besttask

services:
  api:
    build: .
    image: besttask-api-dev
    env_file:
      - .env
    environment:
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3100}
      # Docker Desktop's bind mounts do not deliver file events, so without
      # polling `tsx watch` silently keeps running stale code.
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "${PORT:-4000}:${PORT:-4000}"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    # The bind mount hides generated files from the image. Generate the Prisma
    # client in the mounted source tree before the API imports it.
    command: sh -c "npm run db:generate && exec npm run dev"
    stdin_open: true
    tty: true

  web:
    build: ./web
    image: besttask-web-dev
    environment:
      # Vite proxies /api to the API container, so the browser needs no CORS.
      API_PROXY_TARGET: http://api:${PORT:-4000}
      # Docker Desktop bind mounts do not deliver file events, so Vite polls.
      VITE_POLLING: "true"
    ports:
      # Host port is configurable because 3000 is often already taken.
      - "${WEB_PORT:-3100}:3100"
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    depends_on:
      - api
    stdin_open: true
    tty: true

volumes:
  node_modules:
  web_node_modules:
