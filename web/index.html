<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Plan work, track tasks, keep the trail." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>BestTask</title>
    <script>
      // The app was renamed from TaskFlow: move its stored values from the old
      // "tf_" keys to "bt_" once, so nobody is signed out or loses settings.
      try {
        for (var i = localStorage.length - 1; i >= 0; i--) {
          var k = localStorage.key(i);
          if (k && k.indexOf("tf_") === 0) {
            var nk = "bt_" + k.slice(3);
            if (localStorage.getItem(nk) === null) localStorage.setItem(nk, localStorage.getItem(k));
            localStorage.removeItem(k);
          }
        }
      } catch (e) {}
      // Apply the last-used appearance before first paint (no light flash).
      try {
        var t = localStorage.getItem("bt_theme");
        var dark = t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.dataset.theme = "dark";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
