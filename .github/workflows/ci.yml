name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  api:
    name: API checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run db:generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  integration:
    name: API integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A throwaway database for this run only; never the hosted one.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: besttask
          POSTGRES_PASSWORD: besttask
          POSTGRES_DB: besttask
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U besttask"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      LOG_LEVEL: warn
      PORT: 4000
      DATABASE_URL: postgres://besttask:besttask@localhost:5432/besttask
      DIRECT_URL: postgres://besttask:besttask@localhost:5432/besttask
      # Test-only secrets for this disposable database.
      JWT_ACCESS_SECRET: ci-only-access-secret-not-for-production
      JWT_REFRESH_SECRET: ci-only-refresh-secret-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run db:generate
      # The same committed migrations production applies on start.
      - run: npm run db:migrate
      # Run the compiled API, as the Docker image does.
      - run: npm run build
      - name: Start API
        run: |
          nohup node dist/server.js > api.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -sf http://localhost:4000/health; then exit 0; fi
            sleep 1
          done
          echo "API did not become healthy"
          cat api.log
          exit 1
      - run: npm run test:integration
      - name: API log
        if: failure()
        run: cat api.log

  web:
    name: Web checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      # Typechecks against the committed routeTree.gen.ts, then builds.
      - run: npm run build
